variation_rules:
  goal: "Demosidorna ska bevisa att Webbportfolio kan skapa olika typer av webbplatser, inte samma mall i olika färger."
  shared_quality:
    - responsivitet
    - tillgänglighet
    - tydlig information
    - stabil navigation
    - möjlighet att lägga till funktioner
    - diskret demomärkning
  forbidden_repetition:
    - samma hero-layout på alla demos
    - samma kortgrid på alla demos
    - samma färglogik på alla demos
    - samma CTA-placering på alla demos
    - samma textton på alla demos
    - samma bildbeskärning på alla demos
    - samma sektionsordning på alla demos

